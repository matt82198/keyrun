name: Game
# Godot 4.7.2 .NET desktop game (game/). Windows is the target platform.
# Owns the required checks `game-test`, `game-e2e` and `game-gate`, plus the non-required `balance` job.
# No paths filter: every PR gets exactly one run of each required name. Each job decides docs-only in its
# own scope step: a code PR runs the real steps; a docs-only PR runs one pass-through step under the same
# check name. No job-level `if:` on a required job (a skipped required check counts as success for branch
# protection: the #473 fail-open this file closes). Docs-only definition as in tests.yml (--no-renames, and tools/game/bots/client/.github are code).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  game-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope (docs-only or code)
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Fails closed to code=true (real steps run) when the diff cannot be computed.
          # --no-renames: a rename lists BOTH paths, so a code file renamed to *.md still reads as code.
          if ! files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null); then
            echo "diff failed; treating as code"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          code=false
          while IFS= read -r f; do
            case "$f" in
              ""|STATE.md|BUILDLOG.md|docs/*|design/*) ;;
              tools/*|game/*|bots/*|client/*|.github/*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Docs-only pass-through
        if: steps.scope.outputs.code == 'false' && success()
        run: 'echo "docs-only PR: game-test has no code to run (pass-through)"'
      - uses: actions/setup-dotnet@v4
        if: steps.scope.outputs.code == 'true' && success()
        with:
          dotnet-version: 8.0.x
      - name: dotnet test (sim purity and unit tests, no engine)
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        # Category=Balance (fork parity) runs in the non-required `balance` job; no other project carries the trait.
        run: dotnet test game/Keyrun.sln --nologo --filter "Category!=Balance" --logger "console;verbosity=normal"

      - name: launch-lock test (tools/godot lock, wall-clock cap, preflight; stub only, never launches Godot)
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/godot/launch-lock-test.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "launch-lock test exited $code" }
          if ($out -notmatch '(?m)^launch-lock-test: PASS') { throw 'launch-lock test did not print PASS' }

      - name: import-cache test (import preflight, import-if-missing, model fallback gate; fixtures only, never launches Godot)
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/godot/import-cache-test.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "import-cache test exited $code" }
          if ($out -notmatch '(?m)^import-cache-test: PASS') { throw 'import-cache test did not print PASS' }

      # #527: screens.ps1 reads the run log through a retried FileShare snapshot after the game exits. A holder
      # process locks the log; a stub .cmd stands in for Godot, so this never launches the engine.
      - name: screens log-lock test (run-log snapshot read under a held lock; stub only, never launches Godot)
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/godot/screens-log-lock-test.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "screens log-lock test exited $code" }
          if ($out -notmatch '(?m)^screens-log-lock-test: PASS') { throw 'screens log-lock test did not print PASS' }

  # Reported, NOT required. The fork-parity dominance oracle has chaotic margins; a red here opens a finding
  # and never blocks a merge. Not a required name, so it may be skipped; it still gates its steps on scope.
  balance:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope (docs-only or code)
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Fails closed to code=true (real steps run) when the diff cannot be computed.
          # --no-renames: a rename lists BOTH paths, so a code file renamed to *.md still reads as code.
          if ! files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null); then
            echo "diff failed; treating as code"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          code=false
          while IFS= read -r f; do
            case "$f" in
              ""|STATE.md|BUILDLOG.md|docs/*|design/*) ;;
              tools/*|game/*|bots/*|client/*|.github/*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        if: steps.scope.outputs.code == 'true' && success()
        with:
          dotnet-version: 8.0.x
      - name: dotnet test (Category=Balance, fork parity dominance)
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        run: dotnet test game/bots/Keyrun.Bots.Tests --nologo --filter "Category=Balance" --logger "console;verbosity=detailed" --logger "trx;LogFileName=balance.trx" --results-directory balance-results
      - name: Upload balance test output
        if: always() && steps.scope.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: balance-test-output
          path: balance-results/
          if-no-files-found: warn
          retention-days: 14

  game-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Per-launch wall-clock cap of tools/godot/godot.ps1 (default 300s for local launches). A cold runner's
      # --build-solutions and export can run longer; 660s stays under the 12-minute step timeouts below.
      KEYRUN_GODOT_TIMEOUT_SEC: '660'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope (docs-only or code)
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Fails closed to code=true (real steps run) when the diff cannot be computed.
          # --no-renames: a rename lists BOTH paths, so a code file renamed to *.md still reads as code.
          if ! files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null); then
            echo "diff failed; treating as code"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          code=false
          while IFS= read -r f; do
            case "$f" in
              ""|STATE.md|BUILDLOG.md|docs/*|design/*) ;;
              tools/*|game/*|bots/*|client/*|.github/*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Docs-only pass-through
        if: steps.scope.outputs.code == 'false' && success()
        run: 'echo "docs-only PR: game-e2e has no code to run (pass-through)"'
      - uses: actions/setup-dotnet@v4
        if: steps.scope.outputs.code == 'true' && success()
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot editor
        id: cache-godot
        if: steps.scope.outputs.code == 'true' && success()
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-stable-mono-win64

      - name: Download Godot editor (verified SHA512)
        if: steps.scope.outputs.code == 'true' && success() && steps.cache-godot.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable"
          $asset = "Godot_v$env:GODOT_VERSION-stable_mono_win64.zip"
          $zip = Join-Path $env:RUNNER_TEMP $asset
          $sums = Join-Path $env:RUNNER_TEMP 'SHA512-SUMS.txt'
          curl.exe --fail --location --silent --show-error --output $sums "$base/SHA512-SUMS.txt"
          curl.exe --fail --location --silent --show-error --output $zip "$base/$asset"
          $expected = ((Get-Content $sums | Where-Object { $_ -match ([regex]::Escape($asset) + '$') }) -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA512).Hash.ToLowerInvariant()
          if (-not $expected -or $actual -ne $expected) { throw "SHA512 mismatch for $asset" }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'godot') -Force

      - name: Locate Godot
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'godot') -Recurse -Filter "Godot_v$env:GODOT_VERSION-stable_mono_win64_console.exe" | Select-Object -First 1
          if (-not $exe) { throw 'Godot console binary not found after download' }
          "KEYRUN_GODOT=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Engine version
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        run: ./tools/godot/godot.ps1 --version

      - name: Build C# solution in the editor (headless)
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        # Escape keyrun-game-e2e-export-hang: a stall must fail visibly here,
        # not run to the 30-minute job timeout with no output.
        timeout-minutes: 12
        run: ./tools/godot/godot.ps1 --headless --path game --build-solutions --quit

      # f-30dcbb08: the scene tests refuse an unimported tree (exit 6) and SimDriverSceneTest pins ACTOR fallback=0,
      # so the import cache must be filled first. import.ps1 exits non-zero when any model is still unimported.
      - name: Import assets (godot --headless --import, must print IMPORT done)
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/godot/import.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "import.ps1 exited $code" }
          if ($out -notmatch '(?m)^IMPORT done files=\d+') { throw 'import.ps1 did not print IMPORT done' }

      # Module-boundary review slice S3: every game/src/**/*SceneTest.ps1 runs here, found by glob and never listed by
      # name, sorted by path under game/src. Each must exit 0 and print "<Name>: PASS" (<Name> = the file's base name); a new
      # scene test is wired by adding the file. Every test runs even after a failure, and the step fails at the end
      # naming each failed test; finding no test at all fails the step. Each test's output goes to scene-logs/<Name>.log
      # and each test's engine output to scene-logs/<Name>.engine.log (the HUD runs write it), uploaded on failure below.
      # The two harnesses whose names do not end in SceneTest (NameplateDeclutterTest, CombatTextOverlapTest) keep
      # their own steps below until they are renamed (NameplateDeclutterTest.ps1 is owned by open PR #528).
      - name: Scene tests (every game/src/**/*SceneTest.ps1, each must print <Name> PASS)
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path scene-logs | Out-Null
          $env:KEYRUN_SCENE_LOG_DIR = (Resolve-Path scene-logs).Path
          $root = (Resolve-Path game/src).Path
          $tests = @(Get-ChildItem -Path $root -Recurse -File -Filter '*SceneTest.ps1' |
              Where-Object { $_.Name.EndsWith('SceneTest.ps1', [StringComparison]::Ordinal) } |
              Sort-Object { $_.FullName.Substring($root.Length).Replace('\', '/') } -CaseSensitive)
          if ($tests.Count -eq 0) { throw 'no game/src/**/*SceneTest.ps1 found: the scene test glob ran nothing' }
          Write-Output "scene tests: $($tests.Count) found"
          $tests | ForEach-Object { Write-Output "  $($_.FullName.Substring($root.Length + 1).Replace('\', '/'))" }
          $failed = @()
          foreach ($t in $tests) {
            $name = $t.BaseName
            Write-Output "::group::$name"
            $out = & $t.FullName 2>&1 | Out-String
            $code = $LASTEXITCODE
            $out | Out-File -FilePath (Join-Path scene-logs "$name.log") -Encoding utf8
            Write-Output $out
            Write-Output '::endgroup::'
            if ($code -ne 0) { $failed += "$name exited $code" }
            elseif ($out -notmatch ('(?m)^' + [regex]::Escape($name) + ': PASS')) { $failed += "$name did not print '${name}: PASS'" }
            else { Write-Output "scene test ok: ${name}: PASS" }
          }
          if ($failed.Count -gt 0) { throw ("scene tests failed ($($failed.Count) of $($tests.Count)): " + ($failed -join '; ')) }
          Write-Output "scene tests: $($tests.Count) of $($tests.Count) printed PASS"

      - name: Nameplate declutter test (must print PASS)
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./game/src/Hud/NameplateDeclutterTest.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "NameplateDeclutterTest exited $code" }
          if ($out -notmatch '(?m)^NameplateDeclutterTest: PASS') { throw 'NameplateDeclutter test did not print PASS' }

      - name: Combat text overlap test (1280x720 autorun, must print PASS)
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./game/src/Hud/CombatTextOverlapTest.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "CombatTextOverlapTest exited $code" }
          if ($out -notmatch '(?m)^CombatTextOverlapTest: PASS') { throw 'CombatTextOverlapTest did not print PASS' }

      - name: Upload scene test logs on failure
        if: failure() && steps.scope.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scene-test-logs
          path: scene-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Boot smoke (headless, must print SMOKE ok)
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./tools/godot/godot.ps1 --headless --path game --quit-after 60 '--' --smoke 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "boot smoke exited $code" }
          if ($out -notmatch '(?m)^SMOKE ok') { throw 'boot smoke did not print SMOKE ok' }

      - name: Cache export templates
        id: cache-templates
        if: steps.scope.outputs.code == 'true' && success()
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-stable-mono-windows-x86_64

      - name: Install export templates
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        run: ./tools/godot/install-templates.ps1 -TemplatesRoot (Join-Path $env:RUNNER_TEMP 'export_templates')

      - name: Link templates into Godot's data dir
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        run: |
          $target = Join-Path $env:APPDATA 'Godot/export_templates'
          New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          New-Item -ItemType Junction -Path $target -Target (Join-Path $env:RUNNER_TEMP 'export_templates') | Out-Null

      - name: Export Windows Desktop release
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        # Escape keyrun-game-e2e-export-hang: a stall must fail visibly here.
        # A healthy export takes well under a minute once godot.ps1 disables
        # MSBuild node reuse and the shared compiler server.
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $log = 'build/export.log'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & ./tools/godot/godot.ps1 --headless --path game --export-release "Windows Desktop" ../build/keyrun.exe 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Write-Output "export exit=$code wall=$([int]$sw.Elapsed.TotalSeconds)s (log: $log)"
          if ($code -ne 0) { throw "export exited $code" }
          # Godot exits 0 when the .NET publish fails ("completed with warnings")
          # and still writes an exe with no assemblies. Fail closed on both signs.
          if (Select-String -Path $log -SimpleMatch -Quiet 'Export .NET Project: Failed to build project') { throw '.NET publish failed during export (see export.log)' }
          if (-not (Test-Path build/data_Keyrun_windows_x86_64)) { throw 'build/data_Keyrun_windows_x86_64 (published assemblies) missing after export' }
          if (-not (Test-Path build/keyrun.exe)) { throw 'build/keyrun.exe missing after export' }
          Get-ChildItem build | Format-Table Name, Length

      - name: Upload export log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-export-log
          path: build/export.log
          if-no-files-found: warn
          retention-days: 7

      - name: Exported exe smoke (must print SMOKE ok)
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./build/keyrun.console.exe --headless '--' --smoke 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "exported smoke exited $code" }
          if ($out -notmatch '(?m)^SMOKE ok') { throw 'exported exe did not print SMOKE ok' }

      # Lane 3E (D10 bar): the EXPORTED exe runs the Warden plus Chanter and
      # Cinder bot party through pull 1 headless (--autorun, ticks from
      # game/fixtures/input/walk-kick.json) twice, and E2eAssert.ps1 asserts the
      # three seats, the bot heal and damage in pull 1, a live HUD ping and an
      # equal BOTS done hash across both runs. Fails closed on any missing line.
      - name: Exported exe e2e (bot party through pull 1, must print PASS)
        if: steps.scope.outputs.code == 'true' && success()
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./game/src/Host/E2eAssert.ps1 -Exe build/keyrun.console.exe -Fixture game/fixtures/input/walk-kick.json -OutDir build/e2e 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "E2eAssert exited $code" }
          if ($out -notmatch '(?m)^E2eAssert: PASS') { throw 'E2eAssert did not print PASS' }

      - name: Upload e2e run logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: game-e2e-run-logs
          path: build/e2e/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows build
        if: steps.scope.outputs.code == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: keyrun-windows-x86_64
          path: build/
          if-no-files-found: error
          retention-days: 7

  # Required: game-gate. It keeps `if: always()` on purpose: without it, a failed needed job would SKIP this
  # job, and a skipped required check counts as success. The job never skips; it reads needs.game-e2e.result.
  # Runs on every PR; passes trivially when no game path changed (tools/ci/game_gate.py).
  game-gate:
    needs: [game-test, game-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require game-e2e success for game-path changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          E2E_RESULT: ${{ needs.game-e2e.result }}
        run: python3 tools/ci/game_gate.py --base "$BASE_SHA" --head "$HEAD_SHA" --e2e-result "$E2E_RESULT"
