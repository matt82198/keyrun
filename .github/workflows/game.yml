name: Game
# Godot 4.7.2 .NET desktop game (game/). Windows is the target platform.
# Jobs game-test and game-e2e are NON-required until phase 4A renames them
# test and e2e (ENGINE-PLAN section 5); tests.yml stays the required gate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  game-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: dotnet test (sim purity and unit tests, no engine)
        shell: pwsh
        run: dotnet test game/Keyrun.sln --nologo --logger "console;verbosity=normal"

  game-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot editor
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-stable-mono-win64

      - name: Download Godot editor (verified SHA512)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable"
          $asset = "Godot_v$env:GODOT_VERSION-stable_mono_win64.zip"
          $zip = Join-Path $env:RUNNER_TEMP $asset
          $sums = Join-Path $env:RUNNER_TEMP 'SHA512-SUMS.txt'
          curl.exe --fail --location --silent --show-error --output $sums "$base/SHA512-SUMS.txt"
          curl.exe --fail --location --silent --show-error --output $zip "$base/$asset"
          $expected = ((Get-Content $sums | Where-Object { $_ -match ([regex]::Escape($asset) + '$') }) -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA512).Hash.ToLowerInvariant()
          if (-not $expected -or $actual -ne $expected) { throw "SHA512 mismatch for $asset" }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'godot') -Force

      - name: Locate Godot
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'godot') -Recurse -Filter "Godot_v$env:GODOT_VERSION-stable_mono_win64_console.exe" | Select-Object -First 1
          if (-not $exe) { throw 'Godot console binary not found after download' }
          "KEYRUN_GODOT=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Engine version
        shell: pwsh
        run: ./tools/godot/godot.ps1 --version

      - name: Build C# solution in the editor (headless)
        shell: pwsh
        # Escape keyrun-game-e2e-export-hang: a stall must fail visibly here,
        # not run to the 30-minute job timeout with no output.
        timeout-minutes: 12
        run: ./tools/godot/godot.ps1 --headless --path game --build-solutions --quit

      - name: SimDriver scene test (40 sim ticks headless, must print PASS)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./game/src/Host/SimDriverSceneTest.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "SimDriver scene test exited $code" }
          if ($out -notmatch '(?m)^SimDriverSceneTest: PASS') { throw 'SimDriver scene test did not print PASS' }

      - name: HUD scene test (run-end title, reward cards, recorded input, must print PASS)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./game/src/Host/HudSceneTest.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "HUD scene test exited $code" }
          if ($out -notmatch '(?m)^HudSceneTest: PASS') { throw 'HUD scene test did not print PASS' }

      - name: Combat view scene test (must print PASS)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./game/src/Host/CombatViewSceneTest.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "CombatView scene test exited $code" }
          if ($out -notmatch '(?m)^CombatViewSceneTest: PASS') { throw 'CombatView scene test did not print PASS' }

      - name: Screen scene test (between-runs screen, must print PASS)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./game/src/Hud/ScreenSceneTest.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "Screen scene test exited $code" }
          if ($out -notmatch '(?m)^ScreenSceneTest: PASS') { throw 'Screen scene test did not print PASS' }

      - name: Run-end bonus loot scene test (end-of-run panel, must print PASS)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./game/src/Hud/RunEndBonusSceneTest.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "RunEndBonusSceneTest exited $code" }
          if ($out -notmatch '(?m)^RunEndBonusSceneTest: PASS') { throw 'RunEndBonus scene test did not print PASS' }

      - name: Gate view scene test (room entry gate in scene tree, must print PASS)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./game/src/Host/GateViewSceneTest.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "GateViewSceneTest exited $code" }
          if ($out -notmatch '(?m)^GateViewSceneTest: PASS') { throw 'GateView scene test did not print PASS' }

      - name: Gate cut-away scene test (shut gate between camera and party, must print PASS)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./game/src/Host/GateCutawaySceneTest.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "GateCutawaySceneTest exited $code" }
          if ($out -notmatch '(?m)^GateCutawaySceneTest: PASS') { throw 'GateCutaway scene test did not print PASS' }

      - name: Nameplate declutter test (must print PASS)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./game/src/Hud/NameplateDeclutterTest.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "NameplateDeclutterTest exited $code" }
          if ($out -notmatch '(?m)^NameplateDeclutterTest: PASS') { throw 'NameplateDeclutter test did not print PASS' }

      - name: Help hint scene test (must print PASS)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./game/src/Hud/HelpHintSceneTest.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "HelpHintSceneTest exited $code" }
          if ($out -notmatch '(?m)^HelpHintSceneTest: PASS') { throw 'HelpHintSceneTest did not print PASS' }

      - name: Boot smoke (headless, must print SMOKE ok)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./tools/godot/godot.ps1 --headless --path game --quit-after 60 '--' --smoke 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "boot smoke exited $code" }
          if ($out -notmatch '(?m)^SMOKE ok') { throw 'boot smoke did not print SMOKE ok' }

      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-stable-mono-windows-x86_64

      - name: Install export templates
        shell: pwsh
        run: ./tools/godot/install-templates.ps1 -TemplatesRoot (Join-Path $env:RUNNER_TEMP 'export_templates')

      - name: Link templates into Godot's data dir
        shell: pwsh
        run: |
          $target = Join-Path $env:APPDATA 'Godot/export_templates'
          New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          New-Item -ItemType Junction -Path $target -Target (Join-Path $env:RUNNER_TEMP 'export_templates') | Out-Null

      - name: Export Windows Desktop release
        shell: pwsh
        # Escape keyrun-game-e2e-export-hang: a stall must fail visibly here.
        # A healthy export takes well under a minute once godot.ps1 disables
        # MSBuild node reuse and the shared compiler server.
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $log = 'build/export.log'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & ./tools/godot/godot.ps1 --headless --path game --export-release "Windows Desktop" ../build/keyrun.exe 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Write-Output "export exit=$code wall=$([int]$sw.Elapsed.TotalSeconds)s (log: $log)"
          if ($code -ne 0) { throw "export exited $code" }
          # Godot exits 0 when the .NET publish fails ("completed with warnings")
          # and still writes an exe with no assemblies. Fail closed on both signs.
          if (Select-String -Path $log -SimpleMatch -Quiet 'Export .NET Project: Failed to build project') { throw '.NET publish failed during export (see export.log)' }
          if (-not (Test-Path build/data_Keyrun_windows_x86_64)) { throw 'build/data_Keyrun_windows_x86_64 (published assemblies) missing after export' }
          if (-not (Test-Path build/keyrun.exe)) { throw 'build/keyrun.exe missing after export' }
          Get-ChildItem build | Format-Table Name, Length

      - name: Upload export log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-export-log
          path: build/export.log
          if-no-files-found: warn
          retention-days: 7

      - name: Exported exe smoke (must print SMOKE ok)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./build/keyrun.console.exe --headless '--' --smoke 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "exported smoke exited $code" }
          if ($out -notmatch '(?m)^SMOKE ok') { throw 'exported exe did not print SMOKE ok' }

      # Lane 3E (D10 bar): the EXPORTED exe runs the Warden plus Chanter and
      # Cinder bot party through pull 1 headless (--autorun, ticks from
      # game/fixtures/input/walk-kick.json) twice, and E2eAssert.ps1 asserts the
      # three seats, the bot heal and damage in pull 1, a live HUD ping and an
      # equal BOTS done hash across both runs. Fails closed on any missing line.
      - name: Exported exe e2e (bot party through pull 1, must print PASS)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & ./game/src/Host/E2eAssert.ps1 -Exe build/keyrun.console.exe -Fixture game/fixtures/input/walk-kick.json -OutDir build/e2e 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "E2eAssert exited $code" }
          if ($out -notmatch '(?m)^E2eAssert: PASS') { throw 'E2eAssert did not print PASS' }

      - name: Upload e2e run logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: game-e2e-run-logs
          path: build/e2e/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: keyrun-windows-x86_64
          path: build/
          if-no-files-found: error
          retention-days: 7

  # Guard for escape keyrun-game-e2e-export-hang (PR #117 merged with a hung,
  # then cancelled, game-e2e because nothing required it). Required on main:
  # any PR whose diff touches game/** or tools/godot/** needs game-e2e success.
  # Runs on every PR; passes trivially when no game path changed. Fails closed.
  game-gate:
    needs: [game-test, game-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require game-e2e success for game-path changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          E2E_RESULT: ${{ needs.game-e2e.result }}
        run: python3 tools/ci/game_gate.py --base "$BASE_SHA" --head "$HEAD_SHA" --e2e-result "$E2E_RESULT"
