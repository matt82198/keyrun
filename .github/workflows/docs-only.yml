name: Docs only
# Satisfies the required status checks (test, e2e, game-test, game-gate, game-e2e) for PRs whose every
# changed file is documentation, so tests.yml and game.yml (which ignore these paths) need not run.
#
# Mutually exclusive with the real workflows:
#   docs-only PR : tests.yml and game.yml do not trigger (every path ignored); this workflow runs and the
#                  five jobs below pass with one echo each.
#   code-only PR : this workflow does not trigger (no path matches); the real jobs run.
#   mixed PR     : GitHub triggers BOTH (a single matching path triggers `paths`; a single non-ignored path
#                  triggers the real workflows). The `detect` job sees a code file and the five named jobs
#                  are SKIPPED here, so the real jobs alone decide the required checks. They are skipped
#                  and not failed because a required context with any failing run blocks the merge for good.
# Keep the path list identical to tests.yml and game.yml (YAML anchors are not used on purpose).
on:
  push:
    branches: [main]
    paths:
      - 'STATE.md'
      - 'BUILDLOG.md'
      - 'docs/**'
      - 'design/**'
      - '**/*.md'
      - '.github/CODEOWNERS'
  pull_request:
    paths:
      - 'STATE.md'
      - 'BUILDLOG.md'
      - 'docs/**'
      - 'design/**'
      - '**/*.md'
      - '.github/CODEOWNERS'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Any non-docs file changed?
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Fails closed to code=true (named jobs skipped, real jobs decide) when the diff cannot be computed.
          if ! files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null); then
            echo "diff failed; assuming code changed"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          if echo "$files" | grep -Evq '^(STATE\.md|BUILDLOG\.md|docs/.*|design/.*|\.github/CODEOWNERS|.*\.md)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: detect
    if: needs.detect.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: 'echo "docs-only: test skipped"'

  e2e:
    needs: detect
    if: needs.detect.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: 'echo "docs-only: e2e skipped"'

  game-test:
    needs: detect
    if: needs.detect.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: 'echo "docs-only: game-test skipped"'

  game-e2e:
    needs: detect
    if: needs.detect.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: 'echo "docs-only: game-e2e skipped"'

  game-gate:
    needs: detect
    if: needs.detect.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: 'echo "docs-only: game-gate skipped"'
