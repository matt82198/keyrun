name: Tests
# Owns the required checks `test` (lane row-file gate) and `e2e` (no suite left; see the job). No paths filter: every PR gets exactly one run of each name.
# Each job decides docs-only in its own first step (the scope step). A code PR runs the real steps; a
# docs-only PR runs one pass-through step under the same check name. No job-level `if:` here, because a
# skipped required check counts as success for branch protection (the #473 fail-open this file closes).
# Docs-only definition: STATE.md, BUILDLOG.md, docs/**, design/**, and *.md outside tools/, game/, bots/, client/, .github/
# (.github/** and tools/** are code: CODEOWNERS and tools/Keyrun.Playtest/GUIDE.md are read by gates). Renames count both paths.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope (docs-only or code)
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Fails closed to code=true (real steps run) when the diff cannot be computed.
          # --no-renames: a rename lists BOTH paths, so a code file renamed to *.md still reads as code.
          if ! files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null); then
            echo "diff failed; treating as code"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          code=false
          while IFS= read -r f; do
            case "$f" in
              ""|STATE.md|BUILDLOG.md|docs/*|design/*) ;;
              tools/*|game/*|bots/*|client/*|.github/*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Docs-only pass-through
        if: steps.scope.outputs.code == 'false' && success()
        run: 'echo "docs-only PR: test has no code to run (pass-through)"'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.code == 'true' && success()
        with:
          node-version: 24
      - name: npm ci
        if: steps.scope.outputs.code == 'true' && success()
        run: npm ci
      # The frozen TypeScript sim/client/bots/screen/server and their typecheck, vitest suites and esbuild
      # bundle were removed. The one TS suite left is the lane row-file gate.
      - name: lane row-file gate (npx vitest run tests/lanes)
        if: steps.scope.outputs.code == 'true' && success()
        run: npx vitest run tests/lanes
  # Required check name kept so branch protection still resolves. Its only suite (tests/client/e2e, the
  # Playwright run of the TS browser client) and that suite's wait ratchet were removed with the TS tree.
  # Until `e2e` is dropped from the required checks, this job states that and passes.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope (docs-only or code)
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Fails closed to code=true (real steps run) when the diff cannot be computed.
          # --no-renames: a rename lists BOTH paths, so a code file renamed to *.md still reads as code.
          if ! files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null); then
            echo "diff failed; treating as code"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          code=false
          while IFS= read -r f; do
            case "$f" in
              ""|STATE.md|BUILDLOG.md|docs/*|design/*) ;;
              tools/*|game/*|bots/*|client/*|.github/*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Docs-only pass-through
        if: steps.scope.outputs.code == 'false' && success()
        run: 'echo "docs-only PR: e2e has no code to run (pass-through)"'
      - name: No TypeScript e2e suite (removed with the TS client)
        if: steps.scope.outputs.code == 'true' && success()
        shell: bash
        run: |
          # Fails closed if a TS e2e suite comes back without this job being rewired to run it.
          if [ -d tests/client/e2e ]; then echo "tests/client/e2e exists again: rewire this job to run it"; exit 1; fi
          echo "e2e: the TS browser e2e suite was removed; game e2e runs in game.yml game-e2e"
