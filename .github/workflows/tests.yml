name: Tests
on:
  # Docs-only changes skip this workflow; docs-only.yml defines the same required check names for them.
  push:
    branches: [main]
    paths-ignore:
      - 'STATE.md'
      - 'BUILDLOG.md'
      - 'docs/**'
      - 'design/**'
      - '**/*.md'
      - '.github/CODEOWNERS'
  pull_request:
    paths-ignore:
      - 'STATE.md'
      - 'BUILDLOG.md'
      - 'docs/**'
      - 'design/**'
      - '**/*.md'
      - '.github/CODEOWNERS'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python tools/ci/e2e_wait_ratchet.py
      - run: npm run test:e2e
