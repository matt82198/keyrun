<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>keyrun — client shell</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0f14;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      .scene-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hud-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        color: #eef2f6;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      .hud-crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
      }
      .hud-timer {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 28px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }
      .hud-timer-over {
        color: #ff6b6b;
      }
      .hud-slack-track {
        position: absolute;
        top: 54px;
        left: 50%;
        transform: translateX(-50%);
        width: 220px;
        height: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      .hud-slack-fill {
        height: 100%;
        width: 100%;
        background: #6bc6ff;
        transition: width 0.2s linear;
      }
      .hud-slack-depleted {
        background: #ff6b6b;
      }
      .run-end-root {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: rgba(6, 8, 12, 0.82);
        color: #eef2f6;
        text-align: center;
        pointer-events: auto;
      }
      /* RunEndView (src/hud/run-end.ts) shows/hides via the `hidden` attribute; the author
         `display: flex` above outranks the UA `[hidden] { display: none }`, so restate it here or
         the overlay dims the scene and eats every pointer event for the whole run. */
      .run-end-root[hidden] {
        display: none;
      }
      .run-end-title {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0.03em;
      }
      .run-end-cards {
        display: flex;
        gap: 18px;
      }
      .run-end-card {
        width: 180px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 18px;
        border-radius: 10px;
        background: rgba(24, 28, 36, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #eef2f6;
        cursor: pointer;
        font: inherit;
      }
      .run-end-card:hover {
        border-color: #ffe066;
      }
      .hud-ability-bar {
        position: absolute;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
      }
      .hud-ability-slot {
        position: relative;
        width: 48px;
        height: 48px;
        border-radius: 8px;
        background: rgba(20, 24, 30, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      .hud-ability-sweep {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0%;
        background: rgba(0, 0, 0, 0.65);
      }
      .hud-ability-key {
        position: absolute;
        top: 2px;
        left: 4px;
        font-size: 11px;
        opacity: 0.8;
      }
      .hud-ability-cd {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 600;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="../dist/client/src/main.js"></script>
  </body>
</html>
