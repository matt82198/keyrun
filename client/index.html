<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>keyrun: client shell</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0f14;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      .scene-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hud-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        color: #eef2f6;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      .hud-crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
      }
      .hud-timer {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 28px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }
      .hud-timer-over {
        color: #ff6b6b;
      }
      .hud-slack-track {
        position: absolute;
        top: 54px;
        left: 50%;
        transform: translateX(-50%);
        width: 220px;
        height: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      .hud-slack-fill {
        height: 100%;
        width: 100%;
        background: #6bc6ff;
        transition: width 0.2s linear;
      }
      .hud-slack-depleted {
        background: #ff6b6b;
      }
      .run-end-root {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: rgba(6, 8, 12, 0.82);
        color: #eef2f6;
        text-align: center;
        pointer-events: auto;
      }
      /* RunEndView (src/hud/run-end.ts) shows/hides via the `hidden` attribute; the author
         `display: flex` above outranks the UA `[hidden] { display: none }`, so restate it here or
         the overlay dims the scene and eats every pointer event for the whole run. */
      .run-end-root[hidden] {
        display: none;
      }
      .run-end-title {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0.03em;
      }
      .run-end-cards {
        display: flex;
        gap: 18px;
      }
      .run-end-card {
        width: 180px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 18px;
        border-radius: 10px;
        background: rgba(24, 28, 36, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #eef2f6;
        cursor: pointer;
        font: inherit;
      }
      .run-end-card:hover {
        border-color: #ffe066;
      }
      .hud-ability-bar {
        position: absolute;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
      }
      .hud-key-legend {
        position: absolute;
        bottom: 96px;
        left: 50%;
        transform: translateX(-50%);
        white-space: pre;
        font-size: 12px;
        letter-spacing: 0.02em;
        color: #c9d3de;
        background: rgba(12, 16, 22, 0.6);
        padding: 3px 10px;
        border-radius: 4px;
      }
      .hud-ability-slot {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 8px;
        background: rgba(28, 36, 48, 0.92);
        border: 2px solid #6bc6ff;
        overflow: hidden;
        box-sizing: border-box;
      }
      .hud-ability-slot[data-state="cooldown"] {
        border-color: rgba(255, 255, 255, 0.2);
      }
      .hud-ability-slot[data-state="gcd"] {
        border-color: rgba(107, 198, 255, 0.35);
      }
      .hud-ability-slot[data-state="gcd"] .hud-ability-name {
        opacity: 0.55;
      }
      .hud-ability-sweep {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0%;
        background: rgba(0, 0, 0, 0.7);
      }
      .hud-ability-slot[data-state="gcd"] .hud-ability-sweep {
        background: rgba(0, 0, 0, 0.45);
      }
      .hud-ability-key {
        position: absolute;
        top: 2px;
        left: 3px;
        min-width: 14px;
        padding: 0 3px;
        border-radius: 3px;
        background: #ffe066;
        color: #11151b;
        text-shadow: none;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
      }
      .hud-ability-caption {
        position: absolute;
        top: 3px;
        right: 3px;
        font-size: 8px;
        letter-spacing: 0.04em;
        color: #9fb3c8;
      }
      .hud-ability-name {
        position: absolute;
        left: 2px;
        right: 2px;
        bottom: 3px;
        font-size: 11px;
        line-height: 1.1;
        text-align: center;
        font-weight: 600;
      }
      .hud-ability-cd {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 700;
      }
      .hud-cast-error {
        position: absolute;
        bottom: 124px;
        left: 50%;
        transform: translateX(-50%);
        color: #ff6b6b;
        font-size: 18px;
        font-weight: 700;
      }
      .hud-cast-error[hidden] {
        display: none;
      }
      .hud-onboarding {
        position: absolute;
        top: 46%;
        right: 24px;
        transform: translateY(-50%);
        max-width: 380px;
        padding: 14px 18px;
        border-radius: 10px;
        background: rgba(10, 14, 20, 0.85);
        border: 1px solid rgba(255, 224, 102, 0.6);
        color: #eef2f6;
        font-size: 14px;
        line-height: 1.55;
        pointer-events: none;
      }
      .hud-onboarding[hidden] {
        display: none;
      }
      .hud-onboarding-title {
        font-size: 16px;
        font-weight: 700;
        color: #ffe066;
        margin-bottom: 6px;
      }
      .hud-onboarding kbd {
        display: inline-block;
        min-width: 16px;
        padding: 0 5px;
        margin-right: 6px;
        border-radius: 3px;
        background: #ffe066;
        color: #11151b;
        font: 700 13px/1.4 "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="../dist/client/src/main.js"></script>
  </body>
</html>
