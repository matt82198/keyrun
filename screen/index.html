<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Keyrun - Character &amp; Queue</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #14171f;
    --border: #262b36;
    --text: #e8ebf1;
    --text-dim: #9aa3b2;
    --accent: #5ad1a6;
    --accent-dim: #2f6f57;
    --new: #ffb454;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.4;
  }
  h1 { font-size: 1.2rem; margin: 0 0 16px; }
  h2 { font-size: 1rem; margin: 0 0 8px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; }
  h3 { font-size: 0.9rem; margin: 12px 0 4px; color: var(--text-dim); }
  .band {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
    max-width: 480px;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 4px 0; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  li:last-child { border-bottom: none; }
  .keybind {
    background: var(--accent-dim);
    color: var(--text);
    border-radius: 4px;
    padding: 2px 6px;
    font-weight: bold;
    min-width: 1.6em;
    text-align: center;
  }
  .talent-id { color: var(--text-dim); font-size: 0.85em; margin-left: auto; }
  .new-badge {
    background: var(--new);
    color: #1a1200;
    font-size: 0.7em;
    font-weight: bold;
    border-radius: 4px;
    padding: 2px 5px;
  }
  .key-stepper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .key-btn {
    background: var(--accent-dim);
    color: var(--text);
    border: none;
    border-radius: 4px;
    width: 2em;
    height: 2em;
    font-size: 1rem;
  }
  .key-btn:disabled { opacity: 0.4; }
  .key-value { min-width: 2em; text-align: center; font-size: 1.1rem; font-weight: bold; }
  .key-locked-note { color: var(--text-dim); font-size: 0.8em; }
  .dungeon-select { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
  select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px;
  }
  .queue-band { margin-top: 10px; }
  .role-slots { display: flex; gap: 8px; flex-wrap: wrap; }
  .role-slots li { border: none; padding: 2px 0; }
  .queue-toggle, .play-button {
    display: inline-block;
    margin-top: 8px;
    background: var(--accent);
    color: #04140d;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
  }
  .ready-countdown { display: block; color: var(--text-dim); margin-top: 4px; }
  .run-history li { justify-content: space-between; }
  .talent-fork { display: flex; flex-direction: column; gap: 2px; width: 100%; margin: 4px 0 8px; }
  .talent-option { display: flex; align-items: flex-start; gap: 6px; font-size: 0.85em; color: var(--text-dim); cursor: pointer; }
  .talent-option input { margin-top: 3px; }
  .loadout-summary { margin-top: 10px; }
  .loadout-log li { font-size: 0.85em; color: var(--text-dim); border: none; padding: 2px 0; }
  .loadout-error { color: #ff6b6b; }
  .loadout-empty { color: var(--text-dim); font-size: 0.85em; }
  .facet-picker { display: flex; align-items: center; gap: 6px; width: 100%; margin-top: 4px; }
  .facet-picker-label { color: var(--text-dim); font-size: 0.8em; }
  .facet-picker-select { flex: 1; min-width: 0; }
  .clause-picker { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .clause-option { display: flex; align-items: flex-start; gap: 6px; font-size: 0.9em; cursor: pointer; }
  .clause-option input { margin-top: 3px; }
  @media (min-width: 600px) {
    body { padding: 24px; }
  }
</style>
</head>
<body>
<h1>Keyrun - Character &amp; Queue</h1>
<main>
  <section id="character-band" class="band" aria-label="Character"></section>
  <section id="loadout-band" class="band" aria-label="Loadout"></section>
  <section id="run-band" class="band" aria-label="Run"></section>
  <section id="reward" class="band" aria-label="Reward"></section>
</main>
<script type="module" src="../dist/screen/src/main.js"></script>
</body>
</html>
